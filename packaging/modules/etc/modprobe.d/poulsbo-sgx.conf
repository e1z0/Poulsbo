# Poulsbo SGX driver stack — module load configuration.
#
# Blacklist the stock in-kernel gma500_gfx so it does not auto-load (from the
# initramfs or udev) and grab the GMA500 device before our stack does.  Our
# poulsbo-sgx.service insmods the replacement gma500_gfx (plus pvrsrvkm and
# gma500dc) by absolute path, which a blacklist does not prevent.
blacklist gma500_gfx

# Belt-and-braces: if anything ever modprobes gma500_gfx by name, force the
# display-only SGX handoff option so pvrsrvkm can own the SGX render core.
options gma500_gfx gma_no_sgx=1
