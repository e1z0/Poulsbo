# Poulsbo GMA500 — use the open EXA acceleration driver (xf86-video-gma500blt)
# for the SGX 2D BLIT engine instead of the unaccelerated modesetting driver.
#
# To disable (fall back to the generic modesetting driver), remove or rename
# this file, e.g.:  sudo mv 20-poulsbo-gma500.conf 20-poulsbo-gma500.conf.disabled
#
# Note: gma500blt needs an Xorg server with video ABI 24 (Ubuntu 18.04 HWE,
# xserver-xorg-core-hwe-18.04).  On the base 18.04 X server (ABI 23) the driver
# will not load and X falls back to modesetting.

Section "Device"
    Identifier  "GMA500 SGX (accelerated)"
    Driver      "gma500blt"
    BusID       "PCI:0:2:0"
EndSection
